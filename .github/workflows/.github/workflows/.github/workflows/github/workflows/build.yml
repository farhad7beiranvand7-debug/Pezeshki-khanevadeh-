name: Build Bazaar Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform
        run: |
          flutter create . --platforms=android --org ir.pezeshk --project-name pezeshk_khanevadeh
          chmod +x ./tool/prepare_platforms.sh || true
          ./tool/prepare_platforms.sh || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons || true

      - name: Build Release APK for CafeBazaar
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload CafeBazaar APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CafeBazaar-Pezeshk-Khanevadeh-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
