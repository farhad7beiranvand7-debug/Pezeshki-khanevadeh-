name: pezeshk_khanevadeh
description: پزشک خانواده - دستیار ساده سلامت خانواده
publish_to: 'none'
version: 1.2.0+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  persian_datetime_picker: ^3.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.10.1
  shamsi_date: ^1.1.0
  intl: ^0.20.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  google_fonts: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/store/icon_1024.png
  min_sdk_android: 23
